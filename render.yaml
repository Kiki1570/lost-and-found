services:
  - type: web
    name: lost-and-found-api
    runtime: node
    plan: free
    rootDir: lost-and-found/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://lost-and-found-frontend.onrender.com

  - type: web
    name: lost-and-found-frontend
    runtime: static
    rootDir: lost-and-found/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://lost-and-found-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
